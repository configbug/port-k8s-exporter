# Default values for port-k8s-exporter

replicaCount: 1

image:
  repository: ghcr.io/configbug/port-k8s-exporter
  tag: ""  # defaults to Chart.appVersion
  pullPolicy: Always

# -------------------------------------------------------------------
# REQUIRED: cluster name (set via --set clusterName=aksinfrdesa001)
# -------------------------------------------------------------------
clusterName: ""

# -------------------------------------------------------------------
# Cluster inventory: maps cluster name → group + size
# Group (1-5) determines webhook URL. Size determines resources.
# Override per environment in values-{env}.yaml
# -------------------------------------------------------------------
clusterInventory: {}
#  aksinfrdesa001: { group: "1", size: small }
#  aksinfrdesa002: { group: "1", size: medium }

# -------------------------------------------------------------------
# Webhook URLs per cluster group (overridden per environment)
# -------------------------------------------------------------------
webhookUrls:
  "1": ""
  "2": ""
  "3": ""
  "4": ""
  "5": ""

# -------------------------------------------------------------------
# Resource profiles by cluster size
# -------------------------------------------------------------------
sizeProfiles:
  small:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  medium:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  large:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

# -------------------------------------------------------------------
# General settings
# -------------------------------------------------------------------

# Event listener type: WEBHOOK or POLLING
eventListenerType: "WEBHOOK"

# Resync interval in minutes
resyncInterval: 5

# Exporter configuration
config:
  createMissingRelatedEntities: true
  resources:
    - kind: v1/namespaces
    - kind: v1/nodes
    - kind: apps/v1/deployments
    - kind: apps/v1/daemonsets
    - kind: apps/v1/statefulsets
    - kind: v1/pods
    - kind: v1/configmaps

# Namespace creation
namespace:
  create: false

# ServiceAccount
serviceAccount:
  nameOverride: ""
  annotations: {}

# Additional environment variables
extraEnv: []
#  - name: MY_VAR
#    value: "my-value"

# Pod scheduling
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: port-k8s-exporter
          topologyKey: kubernetes.io/hostname

# Override chart name
nameOverride: ""
fullnameOverride: ""
