# Values for CERT (Certificación) environment

replicaCount: 1

image:
  tag: "v0.1.9"
  pullPolicy: IfNotPresent

webhookUrl: "https://ingest.getport.io/REPLACE_WITH_CERT_WEBHOOK_URL"

clusterName: "cert-cluster"

eventListenerType: "WEBHOOK"

resyncInterval: 10

config:
  createMissingRelatedEntities: true
  resources:
    - kind: v1/namespaces
    - kind: v1/nodes
    - kind: apps/v1/deployments
    - kind: apps/v1/daemonsets
    - kind: apps/v1/statefulsets
    - kind: apps/v1/replicasets
    - kind: v1/pods
    - kind: v1/configmaps

namespace:
  create: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
