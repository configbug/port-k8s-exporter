# Values for PROD (Producción) environment
#
# Install example:
#   helm install port-exporter chart/ \
#     -f chart/values-prod.yaml \
#     -n port-k8s-exporter --create-namespace \
#     --set clusterName=aksinfrprod001 \
#     --set clusterGroup=3 \
#     --set clusterSize=large

replicaCount: 2

image:
  tag: "v0.1.9"
  pullPolicy: IfNotPresent

eventListenerType: "WEBHOOK"

resyncInterval: 15

# Webhook URLs per cluster group (5 groups)
webhookUrls:
  "1": "https://ingest.getport.io/REPLACE_PROD_GROUP_1"
  "2": "https://ingest.getport.io/REPLACE_PROD_GROUP_2"
  "3": "https://ingest.getport.io/REPLACE_PROD_GROUP_3"
  "4": "https://ingest.getport.io/REPLACE_PROD_GROUP_4"
  "5": "https://ingest.getport.io/REPLACE_PROD_GROUP_5"

# Resource profiles by cluster size
sizeProfiles:
  small:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  medium:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  large:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

config:
  createMissingRelatedEntities: true
  resources:
    - kind: v1/namespaces
    - kind: v1/nodes
    - kind: apps/v1/deployments
    - kind: apps/v1/daemonsets
    - kind: apps/v1/statefulsets
    - kind: apps/v1/replicasets
    - kind: v1/pods
    - kind: v1/configmaps

namespace:
  create: true
