name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.6
          cache: true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Make zig-cc wrappers
        run: |
          sudo tee /usr/local/bin/zigcc-arm64 >/dev/null <<'EOF' 
          #!/usr/bin/env sh
          # Transparently call Zig's musl-enabled cross-compiler
          exec zig cc -target aarch64-linux-musl "$@"
          EOF
          sudo chmod 755 /usr/local/bin/zigcc-arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Debug: Show GoReleaser output structure
      - name: List GoReleaser output
        run: |
          echo "=== dist/ structure ==="
          find dist -type f -name "port-k8s-exporter" | head -20
          echo "=== All directories ==="
          ls -la dist/

      # Prepare binaries for Docker build (reuse GoReleaser output)
      - name: Prepare binaries for Docker
        run: |
          # Copy GoReleaser binaries with arch suffix for Docker
          cp dist/port-k8s-exporter_linux_amd64_v1/port-k8s-exporter ./port-k8s-exporter-amd64
          cp dist/arm_linux_arm64_v8.0/port-k8s-exporter ./port-k8s-exporter-arm64
          
          # Verify binaries exist and are executable
          echo "=== Verifying binaries ==="
          file port-k8s-exporter-amd64
          file port-k8s-exporter-arm64
          ls -la port-k8s-exporter-*

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=port-k8s-exporter
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max