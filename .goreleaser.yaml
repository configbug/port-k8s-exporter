version: 2

before:
  hooks:
    - go mod tidy
builds:
- env:
  - CGO_ENABLED=1
  binary: "{{ .ProjectName }}"
  goos:
  - linux
  goarch:
  - amd64
  ldflags:
  - "-X main.Version={{ .Version }}"
- id: arm
  flags:
  - -tags=musl
  ldflags:
  - -extldflags=-static
  - "-X main.Version={{ .Version }}"
  env:
  - CGO_ENABLED=1
  - CC=/usr/local/bin/zigcc-arm64
  binary: "{{ .ProjectName }}"
  goos:
  - linux
  goarch:
  - arm64

# Docker builds moved to workflow - GoReleaser extra_files has issues with buildx
# dockers: (disabled)
# docker_manifests: (disabled)

archives:
- formats:
    - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

